---
layout: default
title: Contact
description: Contact Import Risk Intelligence.
---

<main>

  <!-- HERO -->
  <section class="contact-hero" aria-label="Contact hero">
    <div class="contact-hero-bg" aria-hidden="true"></div>

    <div class="container">
      <div class="contact-hero-head">
        <h1 class="contact-hero-title">Request Coverage</h1>
        <p class="contact-hero-subtitle">Share your trade lanes and concerns. I’ll reply by email with a brief scope and fit check.</p>
      </div>
    </div>
  </section>

  <!-- FORM -->
  <section class="contact-simple" aria-label="Contact form">
    <div class="container">

      <form class="contact-simple-form" action="https://formspree.io/f/maqdnvve" method="POST">
      
       <input type="hidden" name="_subject" value="IRI coverage request"> 
        <div class="cs-row">
          <label class="cs-label" for="name">Name</label>
          <input class="cs-input" id="name" name="name" type="text" autocomplete="name" required />
        </div>

        <div class="cs-row">
          <label class="cs-label" for="email">Email</label>
          <input class="cs-input" id="email" name="email" type="email" autocomplete="email" required />
        </div>

        <div class="cs-row">
          <label class="cs-label" for="company">Company</label>
          <input class="cs-input" id="company" name="company" type="text" autocomplete="organization" />
        </div>

        <div class="cs-row">
          <label class="cs-label" for="website">Website (optional)</label>
          <input
            class="cs-input"
            id="website"
            name="website"
            type="url"
            autocomplete="url"
            placeholder="https://"
          />
        </div>

        <div class="cs-row">
          <label class="cs-label" for="revenue">Approximate Annual Import Value</label>
          <select class="cs-input" id="revenue" name="annual_revenue">
            <option value="">Select…</option>
            <option value="under_10m">Under $10M</option>
            <option value="10m_50m">$10M–$50M</option>
            <option value="50m_250m">$50M–$250M</option>
            <option value="250m_500m">$250M–$500M</option>
            <option value="over_500m">Over $500M</option>
          </select>
        </div>

        <div class="cs-row">
          <label class="cs-label" for="message">Message</label>
          <textarea
            class="cs-textarea"
            id="message"
            name="message"
            rows="7"
            placeholder="Key trade lanes, ports, products, or concerns you’d like covered…"
            required></textarea>
        </div>

        <div class="cs-actions">
          <button class="cs-button" type="submit">Send Request</button>

          <p class="cs-direct">
            Prefer email?
            <a class="js-email"
               data-user="coverage"
               data-domain="importriskreport.com"
               href="#">
              coverage@importriskreport.com
            </a>
          </p>

        </div>

      </form>

    </div>
  </section>

</main>
