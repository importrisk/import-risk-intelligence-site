---
layout: default
title: Contact
description: Contact Import Risk Intelligence.
---

<main>

  <section class="contact-simple" aria-label="Contact">
    <div class="container">

      <header class="contact-simple-head">
        <h1 class="contact-simple-title">Contact</h1>
        <p class="contact-simple-subtitle">Send a message and I’ll reply by email.</p>
      </header>

      <!-- Swap action/method for your form provider (Netlify/Formspree/etc.) -->
      <form class="contact-simple-form" action="#" method="post">

        <div class="cs-row">
          <label class="cs-label" for="name">Name</label>
          <input class="cs-input" id="name" name="name" type="text" autocomplete="name" required />
        </div>

        <div class="cs-row">
          <label class="cs-label" for="email">Email</label>
          <input class="cs-input" id="email" name="email" type="email" autocomplete="email" required />
        </div>

        <div class="cs-row">
          <label class="cs-label" for="company">Company</label>
          <input class="cs-input" id="company" name="company" type="text" autocomplete="organization" />
        </div>
<div class="cs-row">
  <label class="cs-label" for="website">Website (optional)</label>
  <input
    class="cs-input"
    id="website"
    name="website"
    type="url"
    autocomplete="url"
    placeholder="https://"
  />
</div>

       <div class="cs-row">
  <label class="cs-label" for="revenue">Annual Revenue</label>
  <select class="cs-input" id="revenue" name="annual_revenue">
    <option value="">Select…</option>
    <option value="under_10m">Under $10M</option>
    <option value="10m_50m">$10M–$50M</option>
    <option value="50m_250m">$50M–$250M</option>
    <option value="250m_500m">$250M–$500M</option>
    <option value="over_500m">Over $500M</option>
  </select>
</div>

        <div class="cs-row">
          <label class="cs-label" for="message">Message</label>
          <textarea class="cs-textarea" id="message" name="message" rows="7" required></textarea>
        </div>

        <div class="cs-actions">
          <button class="cs-button" type="submit">Send</button>
        </div>

      </form>

    </div>
  </section>

</main>
